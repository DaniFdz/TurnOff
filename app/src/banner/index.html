<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
<title>TurnOff</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #e9ecf2; }
  .card {
    box-sizing: border-box; height: 100%; display: flex; gap: 12px; align-items: center;
    padding: 16px 18px; border-radius: 12px;
    background: linear-gradient(180deg, #1b1d24, #14161c);
    border: 1px solid #3a3325;
    box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(240,163,94,.15);
  }
  .mark { width: 38px; height: 38px; border-radius: 10px; flex: none;
    background: linear-gradient(160deg, #f0a35e, #a8622a); display: grid; place-items: center;
    color: #1d1408; font-weight: 800; font-size: 17px; }
  .text { min-width: 0; }
  .title { font-weight: 650; letter-spacing: .01em; margin-bottom: 3px; }
  .body { color: #c9cedb; font-size: 12.5px; }
  .hint { color: #8b93a3; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">5'</div>
    <div class="text">
      <div class="title" id="title">TurnOff</div>
      <div class="body" id="body">El ordenador se apaga en 5 minutos.</div>
      <div class="hint" id="hint">Clic para cerrar</div>
    </div>
  </div>
  <script src="banner.js"></script>
</body>
</html>
